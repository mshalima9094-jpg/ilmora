:root{--p:#0f9488;--pd:#0b6f66;--bg:#f1f3f5;--c:#fff;--t:#1f2937;--m:#6b7280;--b:#e5e7eb;--r:#e11d48;--g:#15803d;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f172a;--c:#1e293b;--t:#e5e7eb;--m:#9ca3af;--b:#334155;--r:#fb7185;--g:#4ade80}}
:root[data-theme="dark"]{--bg:#0f172a;--c:#1e293b;--t:#e5e7eb;--m:#9ca3af;--b:#334155;--r:#fb7185;--g:#4ade80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:16px/1.5 'SolaimanLipi','Noto Sans Bengali',system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--p);z-index:30}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--p);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px}
.top b{font-size:17px;flex:1}.top button{background:none;border:0;color:#fff;font-size:24px;padding:0 4px}
.side{position:fixed;top:0;bottom:0;left:0;width:262px;background:var(--c);z-index:40;transform:translateX(-100%);transition:transform .2s;overflow-y:auto;padding-top:env(safe-area-inset-top,0px);border-right:1px solid var(--b)}
.nav .side{transform:none}.nav .shade{display:block}.shade{display:none;position:fixed;inset:0;background:#0006;z-index:35}
.side h3{margin:0;padding:18px 16px;background:var(--pd);color:#fff;font-size:17px}
.side h3 small{display:block;font-weight:400;opacity:.8;font-size:12px}
.side a{display:flex;gap:10px;padding:11px 16px;margin:3px 8px;border-radius:10px;color:var(--t);text-decoration:none}
.side a.on{background:var(--p);color:#fff;font-weight:600}
main{padding:14px;max-width:900px;margin:auto}h1{font-size:21px;margin:4px 0 12px}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:14px;margin-bottom:12px}
.hero{background:var(--pd);color:#fff;border-radius:12px;padding:16px;margin-bottom:12px}.hero h2{margin:0 0 4px;font-size:19px}.hero p{margin:0;opacity:.85;font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.st{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:12px}.st small{color:var(--m);display:block}.st b{font-size:20px}
.g{color:var(--g)}.rd{color:var(--r)}
label{display:block;font-size:13px;color:var(--m);margin-bottom:10px}
input,select,textarea{display:block;width:100%;margin-top:4px;padding:10px;border:1px solid var(--b);border-radius:8px;background:var(--bg);color:var(--t);font:inherit}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.btn{background:var(--p);color:#fff;border:0;border-radius:8px;padding:11px 16px;font:inherit;font-weight:600;width:100%}
.btn.s{width:auto;padding:5px 11px;font-size:13px}.btn.o{background:none;color:var(--p);border:1px solid var(--p)}
.x{background:none;border:0;color:var(--r);font:inherit;font-size:12px;padding:2px 6px}
details>summary{cursor:pointer;font-weight:700;list-style:none;color:var(--pd)}details[open]>summary{margin-bottom:12px}
.row{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-top:1px solid var(--b);align-items:center}
.row:first-child{border-top:0}.row small{display:block;color:var(--m);font-size:12px}.r{text-align:right;display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.th{width:38px;height:38px;object-fit:cover;border-radius:6px;border:1px solid var(--b)}
.em{color:var(--m);text-align:center;margin:10px}.bar{display:flex;gap:8px;align-items:end;margin-bottom:12px}.bar label{flex:1;margin:0}
.bars{display:flex;gap:4px;height:110px;align-items:end}.bc{flex:1;display:flex;align-items:end;gap:1px;height:100%;position:relative}
.bc i{flex:1;border-radius:2px 2px 0 0;min-height:1px}.bc i.a{background:var(--g)}.bc i.b{background:var(--r)}
.lg{display:flex;justify-content:space-between;font-size:11px;color:var(--m);margin-top:3px}
.ov{position:fixed;inset:0;background:#000d;z-index:60;display:flex;align-items:center;justify-content:center}.ov img{max-width:94%;max-height:90%}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#111;color:#fff;padding:10px 18px;border-radius:20px;z-index:70;display:none}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:7px 4px;border-top:1px solid var(--b);text-align:right}td:first-child,th:first-child{text-align:left}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}.fg .w,.fg h4{grid-column:1/-1}h4{margin:12px 0 8px;color:var(--p);border-bottom:1px solid var(--b);padding-bottom:4px;font-size:15px}.md{position:fixed;inset:0;background:var(--bg);z-index:50;overflow-y:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 30px}.md .tb{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:8px}.md .row span{color:var(--m);padding-right:10px}.md .row b{text-align:right}
@media(min-width:900px){.side{transform:none}.top button{display:none}main,.top{margin-left:262px}.top{padding-left:20px}.grid{grid-template-columns:repeat(3,1fr)}.shade{display:none!important}}
.cb{display:flex;align-items:center;gap:8px;margin-bottom:12px}.cb b{flex:1;font-size:18px}
.cg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.ct{border:0;color:#fff;border-radius:16px;padding:14px 4px;min-height:104px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font:inherit;font-size:13px;font-weight:600;text-align:center}.ct span{font-size:30px;line-height:1}
.chero{display:flex;justify-content:space-between;align-items:center;gap:8px}.chero small{display:block;opacity:.85}.chero b{font-size:22px}.pill{background:#fff3;border-radius:20px;padding:3px 10px;font-size:12px}
.fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:auto;padding:13px 20px;border-radius:26px;box-shadow:0 4px 14px #0005;z-index:15}
.ckb{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom,0px));box-shadow:0 -2px 12px #0003;z-index:10}
.av{width:42px;height:42px;border-radius:50%;background:var(--pd);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.tag{font-size:11px;background:#dbeafe;color:#1e40af;border-radius:6px;padding:1px 7px}.tag.s{background:#fef3c7;color:#92400e}
@media(min-width:900px){.cg{grid-template-columns:repeat(4,1fr)}}
.fgw{overflow:auto;max-height:calc(100vh - 300px);min-height:0;border:1px solid var(--b);border-radius:12px;background:var(--c);-webkit-overflow-scrolling:touch}
.fgt{border-collapse:separate;border-spacing:0;min-width:max-content}
.fgt th,.fgt td{padding:6px 5px;border-bottom:1px solid var(--b);text-align:center;background:var(--c)}
.fgt thead th{position:sticky;top:0;z-index:3;font-size:13px;white-space:nowrap;padding:10px 6px}
.fgt .nm{position:sticky;left:0;z-index:2;text-align:left;min-width:108px;max-width:108px;border-right:1px solid var(--b);box-shadow:2px 0 5px #0000001a;cursor:pointer}
.fgt .nm b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fgt .nm small{display:block;color:var(--m)}
.fgt thead .nm{z-index:4;cursor:default}
.fgt .ft{background-image:linear-gradient(#0f948822,#0f948822)}
.fc{width:54px;height:40px;border-radius:10px;border:1px solid var(--b);background:var(--c);color:var(--p);font:inherit;font-size:20px;cursor:pointer}
.fc.ok{background:#dcfce7;border-color:#86efac;color:#166534}.fc.pt{background:#fef3c7;border-color:#fcd34d;color:#92400e}
.cc{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;margin-bottom:2px;-webkit-overflow-scrolling:touch}.cc button{flex:none;border:1px solid var(--b);background:var(--c,#fff);color:inherit;border-radius:20px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}.cc button small{margin-left:5px;opacity:.7;font-weight:400}.cc button.on{background:var(--p);border-color:var(--p);color:#fff}

ss="em" style="text-align:left;margin:6px 0 0">এই সংস্করণে ইউজার ও ভূমিকা এই ব্রাউজারের Local Storage-এ থাকে। তাই একই অ্যাপের ফাইল/ব্রাউজার নিয়ন্ত্রণকারী ব্যক্তি ডেটা বা ভূমিকা পরিবর্তন করতে পারেন। Firebase অংশটি শুধু ব্যাকআপ; এটি Firebase Authentication বা সার্ভার-সাইড অনুমতি নয়। সংবেদনশীল তথ্যসহ বহু-ডিভাইস ব্যবহারের আগে সার্ভার-সাইড Firebase Auth, কাস্টম ক্লেইম ও Firestore Security Rules যুক্ত করতে হবে।</p></div></div>`},
setup(){const T=(l,n,a)=>`<label>${l}<textarea name="${n}" rows="5">${esc(a.join('\n'))}</textarea></label>`;return themeUI()+fontUI()+bkUI()+shareUI()+cloudUI()+pdfUI()+`<div class="card"><b>তালিকা সেটআপ</b><p class="em" style="text-align:left">প্রতি লাইনে একটি করে লিখুন।</p><form onsubmit="return sub(event,'set')">${T('শ্রেণি / জামাত','cl',CL())}${T('আয়ের খাত','cin',CI())}${T('ব্যয়ের খাত','cout',CO())}<button class="btn">সংরক্ষণ করুন</button></form></div><div class="card"><b>ব্যাকআপ ও রিস্টোর</b><p class="em" style="text-align:left">তথ্য এই ফোনের ব্রাউজারে জমা থাকে। নিয়মিত ব্যাকআপ কপি করে কোথাও সংরক্ষণ করুন।</p><textarea id="bk" rows="4" placeholder="রিস্টোরের জন্য এখানে ব্যাকআপ পেস্ট করুন"></textarea><div class="f2" style="margin-top:10px"><button class="btn" onclick="{const j=JSON.stringify(FBX.bk());navigator.clipboard.writeText(j).then(()=>toast('কপি হয়েছে'),()=>{$('#bk').value=j})}">ব্যাকআপ কপি</button><button class="btn o" onclick="exportMigrationBackup()">⬇ মাইগ্রেশন JSON ডাউনলোড</button><button class="btn o" onclick="FBX.restoreText($('#bk').value)">রিস্টোর</button></div></div>`}};
/* ===== ক্যান্টিন ব্যবস্থাপনা ===== */
const CU=['পিস','কেজি','গ্রাম','লিটার','প্যাকেট','ডজন','বক্স'],CEX=['গ্যাস / জ্বালানি','কর্মচারীর বেতন','বিদ্যুৎ বিল','ভাড়া','পরিবহন','মেরামত','অন্যান্য'];
function ld(d=new Date()){return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)}
const num=v=>+en(v)||0,r2=x=>Math.round(x*100)/100,r3=x=>Math.round(x*1000)/1000,sm=(a,f)=>a.reduce((s,x)=>s+(+f(x)||0),0);
const C=()=>{const c=S.cn=S.cn||{};['prod','sales','buys','exp','cust','led','cash','ret'].forEach(k=>c[k]=c[k]||[]);c.open=+c.open||0;return c};
let cv='',cq='',cart={},bcart={},cd=ld(),cmode='day',cf=ld().slice(0,8)+'01',ct=ld(),cexm=ld().slice(0,7),cpe='',lf='',ledq='';
const cBar=(t,x='')=>`<div class="cb"><button class="btn s o" onclick="goBack('canteen')">← ক্যান্টিন</button><b>${t}</b>${x}</div>`;
const cName=id=>(C().cust.find(x=>x.id==id)||{}).name||'—';
const cBal=id=>sm(C().led.filter(l=>l.cid==id),l=>l.k=='due'?l.amt:-l.amt);
const cOwe=u=>u.type=='supplier'?-cBal(u.id):cBal(u.id);
const cNoP=()=>`<div class="card"><p class="em">আগে পণ্য যোগ করুন</p><button class="btn" onclick="nav('canteen/list')">পণ্যের তালিকায় যান</button></div>`;

const cClose=()=>document.querySelectorAll('.md').forEach(x=>x.remove());
function cFind(nm,ph,ty){const c=C();let u=c.cust.find(x=>x.name==nm&&x.type==ty);if(!u){u={id:uid(),name:nm,ph:ph||'',type:ty};c.cust.push(u)}else if(ph&&!u.ph)u.ph=ph;return u.id}
PG.canteen=()=>({sale:cSale,ret:cRet,list:cList,buy:cBuy,cash:cCash,exp:cExp,due:cDue,report:cRep}[cv]||cHome)();

function cHome(){const c=C(),td=ld(),ss=c.sales.filter(s=>s.date==td),n=sm(ss,s=>sm(s.items,i=>i.q)),low=c.prod.filter(p=>p.min>0&&p.stock<=p.min);
const T=[['sale','🛒','পণ্য বিক্রয়','#1e88d6'],['list','📋','পণ্যের তালিকা','#b3175c'],['buy','🛍️','পণ্য ক্রয়','#e07915'],['cash','🧮','ক্যাশ বাক্স','#388e3c'],['exp','💸','ক্যান্টিনের খরচ','#c0392b'],['due','📒','বাকি খাতা','#6a1b9a'],['report','📊','বিক্রির রিপোর্ট','#f5a623'],['bk','☁️','ডাটা ব্যাকআপ','#00acc1']];
return `<div class="hero"><div class="chero"><span>📅 ${dt(td)}</span><span class="pill">${navigator.onLine?'🟢 অনলাইন':'⚪ অফলাইন'}</span></div><hr style="border:0;border-top:1px solid #fff4;margin:12px 0"><div class="chero"><div><small>মোট বিক্রি (আজ)</small><b>${bn(n)} টি</b></div><div style="text-align:right"><small>মোট টাকা (আজ)</small><b>${tk(sm(ss,s=>s.total))}</b></div></div></div><h4 style="border:0;margin-top:4px">কুইক অ্যাকশন</h4><div class="cg">${T.map(t=>`<button class="ct" style="background:${t[3]}" onclick="${t[0]=='bk'?`nav('setup')`:`nav('canteen/${t[0]}')`}"><span>${t[1]}</span>${t[2]}</button>`).join('')}</div>`+(low.length?`<div class="card"><b class="rd">⚠ স্টক কম (${bn(low.length)})</b>${low.map(p=>`<div class="row"><b>${esc(p.name)}</b><b class="rd">${bn(p.stock)} ${esc(p.unit)}</b></div>`).join('')}</div>`:'')}

/* ---- বিক্রয় / ক্রয় (কার্ট) ---- */
const cr=m=>m=='b'?bcart:cart;
function cLines(m){return Object.entries(cr(m)).map(([id,x])=>{const p=C().prod.find(z=>z.id==id),q=num(x.q);if(!p||!(q>0))return null;const pr=(x.p===undefined||x.p==='')?(m=='b'?p.buy:p.sell):num(x.p);return{p,q,pr,t:r2(q*pr)}}).filter(Boolean)}
const cTotS=m=>{const L=cLines(m);return tk(sm(L,l=>l.t))+' ('+bn(L.length)+' পণ্য)'};
function cSet(id,f,v,m){const r=cr(m);(r[id]=r[id]||{})[f]=v;const e=$('#ctot');if(e)e.textContent=cTotS(m)}
function cPc(p,m){const x=cr(m)[p.id]||{},b=m=='b';return `<div class="card"><div class="row" style="border:0;padding:0"><div><b>${esc(p.name)}</b><small>বর্তমান স্টক: ${bn(p.stock)} ${esc(p.unit)}</small></div><b class="${b?'rd':'g'}">${tk(b?p.buy:p.sell)}</b></div><div class="f2" style="margin-top:8px"><label>${b?'ক্রয়ের ':''}পরিমাণ (${esc(p.unit)})<input inputmode="decimal" placeholder="০" value="${esc(x.q||'')}" oninput="cSet('${jx(p.id)}','q',this.value,'${jx(m)}')"></label><label>${b?'ক্রয়':'বিক্রয়'} মূল্য (প্রতি ${esc(p.unit)})<input inputmode="decimal" value="${esc(x.p??(b?p.buy:p.sell))}" oninput="cSet('${jx(p.id)}','p',this.value,'${jx(m)}')"></label></div></div>`}
const cPl=m=>{const k=cq.trim(),a=C().prod.filter(p=>!k||p.name.includes(k));return a.map(p=>cPc(p,m)).join('')||'<p class="em">কোনো পণ্য নেই</p>'};

function cSale(){const c=C(),td=ld(),ss=c.sales.filter(s=>s.date==td),tot=sm(ss,s=>s.total),cash=sm(ss.filter(s=>s.pay=='cash'),s=>s.total);
const head=cBar('পণ্য বিক্রয়',`<button class="btn s o" onclick="nav('canteen/ret')">↩ পণ্য ফেরত</button>`)+`<div class="card"><small style="color:var(--m)">আজকের মোট বিক্রি · ${dt(td)}</small><div style="font-size:24px;font-weight:700">${tk(tot)}</div><div class="row"><span class="g">নগদ বিক্রি ${tk(cash)}</span><span class="rd">বাকি বিক্রি ${tk(tot-cash)}</span></div></div>`;
if(!c.prod.length)return head+cNoP();
return head+`<input placeholder="🔍 বিক্রির জন্য পণ্য খুঁজুন..." value="${esc(cq)}" oninput="cq=this.value;$('#cpl').innerHTML=cPl('s')" style="margin-bottom:12px"><div id="cpl">${cPl('s')}</div>${cNames()}<div class="card ckb"><div class="row" style="border:0;padding:0 0 8px"><b>মোট</b><b id="ctot" class="g">${cTotS('s')}</b></div><label>পেমেন্ট<select id="cpay" onchange="$('#cdue').style.display=this.value=='due'?'block':'none'"><option value="cash">নগদ</option><option value="due">বাকি</option></select></label><div id="cdue" style="display:none"><label>পুরনো গ্রাহক<select id="ccu"><option value="">— বাছুন —</option>${c.cust.filter(u=>u.type=='customer').map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join('')}</select></label><div class="f2"><label>অথবা নতুন গ্রাহকের নাম<input id="cnm" list="cstu"></label><label>মোবাইল<input id="cph" inputmode="tel"></label></div></div><button class="btn" onclick="cSell()">বিক্রয় সম্পন্ন করুন</button></div>`}

function cSell(){const c=C(),L=cLines('s');if(!L.length)return toast('পরিমাণ দিন');
for(const l of L)if(l.q>l.p.stock)return toast(l.p.name+': স্টকে মাত্র '+bn(l.p.stock)+' '+l.p.unit);
const pay=$('#cpay').value;let cid='';
if(pay=='due'){cid=$('#ccu').value;const nm=$('#cnm').value.trim();if(!cid){if(!nm)return toast('গ্রাহক বাছুন বা নাম লিখুন');cid=cFind(nm,$('#cph').value.trim(),'customer')}}
const total=sm(L,l=>l.t),cost=r2(sm(L,l=>l.q*l.p.buy)),id=uid(),date=ld();
L.forEach(l=>l.p.stock=r3(l.p.stock-l.q));

return cBar('পণ্য ফেরত')+`<div class="card"><form onsubmit="return cRsub(event)"><label>পণ্য<select name="pid" onchange="cRfill(this.form)"><option value="">— বাছুন —</option>${c.prod.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></label><div class="f2">${inp('ফেরতের পরিমাণ','q','inputmode="decimal" required oninput="cRfill(this.form)"')}${inp('রিফান্ড (৳)','amt','inputmode="decimal" required')}</div>${sel('স্টকে ফেরত যোগ হবে?','rs',['হ্যাঁ','না (নষ্ট / বাতিল)'])}${inp('নোট','note')}<button class="btn">ফেরত সংরক্ষণ করুন</button></form></div><div class="card"><b>সাম্প্রতিক ফেরত</b>${L.map(r=>`<div class="row"><div><b>${esc(r.n)} · ${bn(r.q)}</b><small>${dt(r.date)}${r.note?' · '+esc(r.note):''}</small></div><div class="r"><b class="rd">${tk(r.amt)}</b><button class="x" onclick="cDel('ret','${jx(r.id)}',this)">মুছুন</button></div></div>`).join('')||'<p class="em">কোনো ফেরত নেই</p>'}</div>`}
function cRfill(f){const p=C().prod.find(x=>x.id==f.pid.value),q=num(f.q.value);if(p&&q>0)f.amt.value=r2(p.sell*q)}
function cRsub(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.target)),c=C(),p=c.prod.find(x=>x.id==d.pid),q=num(d.q),a=num(d.amt);
if(!p){toast('পণ্য বেছে নিন');return false}
if(!Number.isFinite(q)||!Number.isFinite(a)||!(q>0)||a<0){toast('সঠিক পরিমাণ ও রিফান্ড লিখুন');return false}
// ফেরত দেওয়া পরিমাণ ও অর্থ আগের বিক্রির সীমার মধ্যে রাখুন।
const sold=c.sales.reduce((z,s)=>z+(s.items||[]).filter(i=>i.pid==p.id).reduce((n,i)=>n+(+i.q||0),0),0);
const soldValue=c.sales.reduce((z,s)=>z+(s.items||[]).filter(i=>i.pid==p.id).reduce((n,i)=>n+(+i.q||0)*(+i.p||0),0),0);
const prev=c.ret.filter(r=>r.pid==p.id),returned=prev.reduce((z,r)=>z+(+r.q||0),0),refunded=prev.reduce((z,r)=>z+(+r.amt||0),0);
const left=Math.max(0,sold-returned),avg=sold>0?soldValue/sold:0,maxRefund=Math.max(0,Math.min(soldValue-refunded,avg*Math.min(q,left)));
if(q>left+1e-9){toast('বিক্রির অবশিষ্ট পরিমাণের বেশি ফেরত দেওয়া যাবে না');return false}
if(a>maxRefund+0.01){toast('রিফান্ড বিক্রির অবশিষ্ট প্রাপ্য অর্থের বেশি হতে পারবে না (সর্বোচ্চ '+tk(maxRefund)+')');return false}
const rs=String(d.rs||'').startsWith('হ্যাঁ');if(rs)p.stock=r3(p.stock+q);c.ret.push({id:uid(),date:ld(),pid:p.id,n:p.name,q,amt:a,note:d.note||'',rs,c:p.buy});save();render();toast('সংরক্ষিত');return false}

const CG={cs:['নগদ বিক্রি','সরাসরি ক্যাশ বেচাকেনা'],cc:['বাকি আদায়','কাস্টমার বকেয়া পরিশোধ'],ci:['ক্যাশ জমা (ম্যানুয়াল)','মালিকের ব্যক্তিগত ডিপোজিট'],ex:['ক্যান্টিনের খরচ','দৈনন্দিন সাধারণ খরচ'],bc:['নগদ মাল ক্রয়','পাইকারি নগদ কেনাকাটা'],sp:['বাকি পরিশোধ','সাপ্লায়ারের দেনা শোধ'],rf:['পণ্য ফেরত রিফান্ড','কাস্টমার নগদ ফেরত'],co:['ব্যক্তিগত উত্তোলন','মালিকের ক্যাশ উত্তোলন']},GI=['cs','cc','ci'],GO=['ex','bc','sp','rf','co'];

c.exp.forEach(x=>e.push({d:x.date,a:x.amt,g:'ex'}));

return{c,f,t,inr,SI:g=>sm(inr.filter(e=>e.g==g),e=>e.a),op:c.open+net(bf),now:c.open+net(E),ti:sm(inr.filter(e=>I(e.g)),e=>e.a),to:sm(inr.filter(e=>!I(e.g)),e=>e.a),dueS:sm(c.sales.filter(s=>s.pay=='due'&&s.date>=f&&s.date<=t),s=>s.total),dueB:sm(c.buys.filter(b=>b.pay=='due'&&b.date>=f&&b.date<=t),b=>b.total)}}

<div class="bar"><label style="flex:none;width:92px">ধরন<select onchange="cmode=this.value;render()"><option value="day" ${cmode=='day'?'selected':''}>দিন</option><option value="month" ${cmode=='month'?'selected':''}>মাস</option></select></label><button class="btn s o" onclick="cShift(-1)">‹</button><label><input type="date" value="${cd}" onchange="cd=this.value||ld();render()"></label><button class="btn s o" onclick="cShift(1)">›</button></div>
<div class="card"><b class="g">⬇ নগদ আগমন (ক্যাশ ইন)</b>${GI.map(g=>R(g,0)).join('')}</div><div class="card"><b class="rd">⬆ নগদ নির্গমন (ক্যাশ আউট)</b>${GO.map(g=>R(g,1)).join('')}</div><div class="card"><b style="color:#7c3aed">📒 বাকির খতিয়ান (নন-ক্যাশ)</b><div class="row"><div><b>বাকি বিক্রি</b><small>কাস্টমারকে দেওয়া নতুন বাকি</small></div><b>${tk(D.dueS)}</b></div><div class="row"><div><b>বাকি ক্রয়</b><small>সাপ্লায়ার থেকে নেওয়া নতুন দেনা</small></div><b>${tk(D.dueB)}</b></div></div>
${man.length?`<div class="card"><b>ম্যানুয়াল এন্ট্রি</b>${man.map(x=>`<div class="row"><div><b>${x.k=='in'?'ক্যাশ জমা':'ক্যাশ উত্তোলন'}</b><small>${dt(x.date)}${x.note?' · '+esc(x.note):''}</small></div><div class="r"><b class="${x.k=='in'?'g':'rd'}">${tk(x.amt)}</b><button class="x" onclick="cDel('cash','${jx(x.id)}',this)">মুছুন</button></div></div>`).join('')}</div>`:''}

function cRepBody(){const c=C(),inR=d=>d>=cf&&d<=ct,ss=c.sales.filter(s=>inR(s.date)),rt=c.ret.filter(r=>inR(r.date)),ex=sm(c.exp.filter(x=>inR(x.date)),x=>x.amt),tot=sm(ss,s=>s.total),cash=sm(ss.filter(s=>s.pay=='cash'),s=>s.total),cost=sm(ss,s=>s.cost),rf=sm(rt,r=>r.amt),rc=sm(rt.filter(r=>r.rs!==false),r=>r.q*(r.c||0)),gp=tot-rf-(cost-rc),
P={},Dd={};ss.forEach(s=>{s.items.forEach(i=>{const x=P[i.n]=P[i.n]||{q:0,a:0,g:0,u:i.u};x.q+=i.q;x.a+=i.q*i.p;x.g+=(i.p-i.c)*i.q});const y=Dd[s.date]=Dd[s.date]||{t:0,c:0};y.t+=s.total;if(s.pay=='cash')y.c+=s.total});
const st=(l,v,k='')=>`<div class="st"><small>${l}</small><b class="${k}">${tk(r2(v))}</b></div>`;
return `<div class="grid">${st('মোট বিক্রি',tot)}${st('নগদ বিক্রি',cash,'g')}${st('বাকি বিক্রি',tot-cash,'rd')}${st('ফেরত (রিফান্ড)',rf,'rd')}${st('মোট লাভ',gp,gp>=0?'g':'rd')}${st('ক্যান্টিনের খরচ',ex,'rd')}</div><div class="card"><b>নিট লাভ (লাভ − খরচ)</b><div style="font-size:24px;font-weight:700" class="${gp-ex>=0?'g':'rd'}">${tk(r2(gp-ex))}</div></div><div class="card" style="overflow-x:auto"><b>পণ্যভিত্তিক বিক্রি</b><table><tr><th>পণ্য</th><th>পরিমাণ</th><th>টাকা</th><th>লাভ</th></tr>${Object.entries(P).sort((a,b)=>b[1].a-a[1].a).map(([n,x])=>`<tr><td>${esc(n)}</td><td>${bn(r3(x.q))} ${esc(x.u||'')}</td><td>${bn(r2(x.a))}</td><td>${bn(r2(x.g))}</td></tr>`).join('')||'<tr><td>—</td><td></td><td></td><td></td></tr>'}</table></div><div class="card" style="overflow-x:auto"><b>দিনওয়ারি বিক্রি</b><table><tr><th>তারিখ</th><th>মোট</th><th>নগদ</th><th>বাকি</th></tr>${Object.entries(Dd).sort((a,b)=>b[0].localeCompare(a[0])).map(([d,x])=>`<tr><td>${dt(d)}</td><td>${bn(r2(x.t))}</td><td>${bn(r2(x.c))}</td><td>${bn(r2(x.t-x.c))}</td></tr>`).join('')||'<tr><td>—</td><td></td><td></td><td></td></tr>'}</table></div>`}
function cRep(){const c=C(),ss=c.sales.filter(s=>s.date>=cf&&s.date<=ct).sort((a,b)=>(b.date+(b.tm||'')).localeCompare(a.date+(a.tm||''))).slice(0,50);
return cBar('বিক্রির রিপোর্ট',`<button class="btn s o" onclick="cRepPrint()">🖨 প্রিন্ট</button>`)+`<div class="bar"><label>থেকে<input type="date" value="${cf}" onchange="cf=this.value||cf;render()"></label><label>পর্যন্ত<input type="date" value="${ct}" onchange="ct=this.value||ct;render()"></label></div>${cRepBody()}<div class="card"><b>বিক্রির তালিকা (সর্বশেষ ${bn(ss.length)}টি)</b>${ss.map(s=>`<div class="row"><div><b>${s.items.map(i=>esc(i.n)+' '+bn(i.q)).join(', ')}</b><small>${dt(s.date)} ${esc(t12(s.tm))} · ${s.pay=='due'?'বাকি ('+esc(cName(s.cid))+')':'নগদ'}</small></div><div class="r"><b class="g">${tk(s.total)}</b><button class="x" onclick="cDel('sales','${jx(s.id)}',this)">মুছুন</button></div></div>`).join('')||'<p class="em">কোনো বিক্রি নেই</p>'}</div>`}

/* ---- মোছা (স্টক ও বাকি ঠিক রেখে) ---- */
function cDel(k,id,b){if(!b.dataset.s){b.dataset.s=1;b.textContent='নিশ্চিত?';setTimeout(()=>{b.dataset.s='';b.textContent='মুছুন'},3000);return}
const c=C(),pr=i=>c.prod.find(p=>p.id==i);let back='';
if(k=='sales'){const s=c.sales.find(x=>x.id==id);if(s&&(s.items||[]).some(i=>c.ret.some(r=>r.pid==i.pid)))return toast('এই বিক্রির পণ্যের ফেরত রেকর্ড আছে। স্টক ও হিসাব অমিল এড়াতে আগে সংশ্লিষ্ট ফেরত রেকর্ড মুছুন।');(s?s.items:[]).forEach(i=>{const p=pr(i.pid);if(p)p.stock=r3(p.stock+i.q)});c.led=c.led.filter(l=>l.ref!=id)}
else if(k=='buys'){const s=c.buys.find(x=>x.id==id);(s?s.items:[]).forEach(i=>{const p=pr(i.pid);if(p)p.stock=r3(p.stock-i.q)});c.led=c.led.filter(l=>l.ref!=id)}
else if(k=='ret'){const r=c.ret.find(x=>x.id==id),p=r&&pr(r.pid);if(p&&r.rs!==false)p.stock=r3(p.stock-r.q)}
else if(k=='led'){const l=c.led.find(x=>x.id==id);back=l&&l.cid}
else if(k=='cust'){if(Math.abs(cBal(id))>.001)return toast('আগে বাকির হিসাব মেটান');c.led=c.led.filter(l=>l.cid!=id);cClose()}
c[k]=c[k].filter(x=>x.id!=id);save();render();if(back)cDet(back)}
/* ===== পরীক্ষা ও রেজাল্ট: নম্বর এন্ট্রি + সম্মিলিত রেজাল্ট + রেজাল্ট কার্ড ===== */
const xdg=t=>String(t??'').replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]),XD=n=>String(Math.round(n*100)/100).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]);
const xord=n=>n?bn(n)+(n==1?'ম':n==2||n==3?'য়':n==4?'র্থ':n==6?'ষ্ঠ':n<=10?'ম':'তম'):'-';
const GM=[{min:80,name:'মুমতাজ'},{min:70,name:'জা. জিদ্দান'},{min:60,name:'জায়্যিদ'},{min:40,name:'মাকবুল'},{min:0,name:'রাসিব'}],
GG=[{min:80,name:'A+'},{min:70,name:'A'},{min:60,name:'A-'},{min:50,name:'B'},{min:40,name:'C'},{min:33,name:'D'},{min:0,name:'F'}],
GL=[{min:80,name:'মুমতায'},{min:65,name:'জায়্যিদ জিদ্দান'},{min:50,name:'জায়্যিদ'},{min:33,name:'মাকবুল'},{min:0,name:'রাসিব'}];
const exG=e=>(e.grades&&e.grades.length?e.grades:e.mode=='m'?GL:GG).slice().sort((a,b)=>b.min-a.min),
exP=e=>e.pass==null||e.pass===''?33:+e.pass,
gOf=(e,p)=>{const g=exG(e);for(const x of g)if(p>=x.min)return x.name;return g[g.length-1].name},
byRoll=(a,b)=>(parseFloat(en(a.roll))||1e9)-(parseFloat(en(b.roll))||1e9)||String(a.name).localeCompare(String(b.name)),
exSt=e=>S.students.filter(s=>s.cls==e.cls).sort(byRoll),
exRaw=(e,sid,i)=>String(((e.marks||{})[sid]||{})[i]??'').trim();
function calc(e){const P=exP(e),rows=exSt(e).map(s=>{const has=e.subs.some((b,i)=>exRaw(e,s.id,i)!=='');let tot=0,full=0,fail=0;e.subs.forEach((b,i)=>{const v=+en(exRaw(e,s.id,i))||0;tot+=v;full+=b.m;if(has&&v<b.m*P/100)fail++});const p=full?tot/full*100:0;return{s,m:e.marks[s.id]||{},tot,full,p,fail,has,g:!has?'—':fail?exG(e).slice(-1)[0].name:gOf(e,p)}});
const o=rows.filter(r=>r.has).sort((a,b)=>(!!a.fail-!!b.fail)||b.tot-a.tot);o.forEach((r,j)=>{r.pos=j&&!!r.fail==!!o[j-1].fail&&r.tot==o[j-1].tot?o[j-1].pos:j+1});return rows}

QRCode.createData = function(typeNumber, errorCorrectLevel, dataList) {
	
	var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectLevel);
	
	var buffer = new QRBitBuffer();
	
	for (var i = 0; i < dataList.length; i++) {
		var data = dataList[i];

		buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber) );

	var totalDataCount = 0;
	for (var x = 0; x < rsBlocks.length; x++) {
		totalDataCount += rsBlocks[x].dataCount;
	}

		throw new Error("code length overflow. (" + 
            buffer.getLengthInBits() + 
            ">" +  
            totalDataCount * 8 + 
            ")");
	}

	if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
		buffer.put(0, 4);
	}

	// padding
	while (buffer.getLengthInBits() % 8 !== 0) {
		buffer.putBit(false);
	}

	while (true) {
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD0, 8);
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}

QRCode.createBytes = function(buffer, rsBlocks) {

	for (var y = 0; y < rsBlocks.length; y++) {
		totalCodeCount += rsBlocks[y].totalCount;
	}

	var data = new Array(totalCodeCount);
	var index = 0;

	for (var z = 0; z < maxDcCount; z++) {
		for (var s = 0; s < rsBlocks.length; s++) {
			if (z < dcdata[s].length) {

	}

		for (var t = 0; t < rsBlocks.length; t++) {

		}
	}

const ATT=[['manual','✍️','ম্যানুয়াল আগমন/প্রস্থান'],['qr','📷','QR কোড আগমন/প্রস্থান'],['rep','📊','মাসিক / সাপ্তাহিক রিপোর্ট'],['sv','🎓','শিক্ষার্থী হাজিরা ভিউ'],['edit','✏️','হাজিরা এডিট / সংশোধন'],['abs','🚫','অনুপস্থিতি সারসংক্ষেপ'],['lv','📝','ছুটির আবেদন'],['al','🔔','জরুরি নোটিফিকেশন'],['exp','📤','এক্সপোর্ট রিপোর্ট'],['sched','⏰','আগমন-প্রস্থানের সময়সূচি'],['sms','📨','হোয়াটসঅ্যাপ / এসএমএস ও কিউআর সেটিং']];
AT.hub=()=>`<div style="margin-bottom:12px"><b style="font-size:20px">📅 হাজিরা ব্যবস্থাপনা</b></div><div class="atg">${ATT.map(x=>`<div class="atl" onclick="nav('att/${x[0]}')"><span>${x[1]}</span><b>${x[2]}</b></div>`).join('')}</div>`;
AT.manual=()=>{const P=atPer(atG);return atHd('✍️ ম্যানুয়াল আগমন / প্রস্থান')+`<div class="card"><div class="f2">${atDsel()}${atGsel()}</div><label>সাধারণ দেরির সময়সীমা (সময়সূচিতে আলাদা সময় না দিলে)<input type="time" value="${atCfg().late}" onchange="atWCfg(this.value)"></label>${P.length?`<button class="btn s o" onclick="atWAll()">সবাই উপস্থিত (এখনকার সময়ে)</button>`:''}</div><div class="card">${P.map(p=>{const r=atRec(atD,p.k);return `<div class="row" style="flex-wrap:wrap"><div style="flex:1;min-width:140px"><b>${esc(p.n)}</b><small>${esc(p.s)} · আগমন ${tvx(r.i)} · প্রস্থান ${tvx(r.o)}${atFT(p.k)?' · আগমন ২ '+tvx(r.i2)+' · প্রস্থান ২ '+tvx(r.o2):''}${atSchTxt(p.k)?'<br>'+atSchTxt(p.k):''}</small></div><div class="r" style="gap:6px;flex-wrap:wrap">${atCh(atStat(atD,p.k))}<button class="btn s" onclick="atWIn('${jx(p.k)}')">${atFT(p.k)?'আগমন ১':'আগমন'}</button><button class="btn s o" onclick="atWOut('${jx(p.k)}')">${atFT(p.k)?'প্রস্থান ১':'প্রস্থান'}</button>${atFT(p.k)?`<button class="btn s" onclick="atWF('${jx(p.k)}','i2')">আগমন ২</button><button class="btn s o" onclick="atWF('${jx(p.k)}','o2')">প্রস্থান ২</button>`:''}<button class="btn s o" onclick="atWAbs('${jx(p.k)}')">অনুপস্থিত</button></div></div>`}).join('')||'<p class="em">আগে শিক্ষক / শিক্ষার্থী যোগ করুন</p>'}</div>`};
AT.sched=()=>{const c=atCfg(),sc=c.sch||{},G=[['t','👨‍🏫 শিক্ষক / উস্তাদ (ফুলটাইম: ২ দফা)',1],['s','🎓 শিক্ষার্থী — শিশু বাদে সব শ্রেণি (২ দফা)',1],['k','🧒 শিশু শ্রেণি (১ দফা)',0]],L={i:'আগমন',o:'প্রস্থান',i2:'আগমন ২',o2:'প্রস্থান ২'};return atHd('⏰ আগমন-প্রস্থানের সময়সূচি')+`<div class="card"><small style="color:var(--m)">এখানে নির্ধারিত সময় দিন। নির্ধারিত আগমনের (+ অনুমোদিত মিনিট) পরে এলে হাজিরায় "দেরি" ধরা হবে; হাজিরার পাতায় নির্ধারিত সময় দেখাবে। ফাঁকা রাখলে আগের "দেরির সময়সীমা" ব্যবহার হবে।</small></div>${G.map(g=>`<div class="card"><b>${g[0]=='k'?g[1]:g[1]}</b><div class="tio" style="margin-top:8px">${['i','o'].map(f=>`<label>${L[f]}<input type="time" value="${esc((sc[g[0]]||{})[f]||'')}" onchange="atWSch('${g[0]}','${f}',this.value)"></label>`).join('')}</div>${g[2]?`<div class="tio" style="margin-top:8px">${['i2','o2'].map(f=>`<label>${L[f]}<input type="time" value="${esc((sc[g[0]]||{})[f]||'')}" onchange="atWSch('${g[0]}','${f}',this.value)"></label>`).join('')}</div>`:''}</div>`).join('')}<div class="card"><label>দেরি ধরার আগে অতিরিক্ত সময় (মিনিট)<input type="number" min="0" max="120" value="${+c.grace||0}" onchange="atWC('grace',Math.max(0,+this.value||0));render()"></label></div><div class="card"><b>কোন শ্রেণি "শিশু" (১ দফা আগমন-প্রস্থান)?</b><small style="display:block;color:var(--m);margin-bottom:6px">টিক দেওয়া শ্রেণির শিক্ষার্থীর শুধু ১টি আগমন ও ১টি প্রস্থান হবে; বাকি সব শ্রেণির ২টি করে।</small>${CL().map(x=>`<label style="display:flex;gap:8px;align-items:center;margin:6px 0"><input type="checkbox" style="width:auto;margin:0" ${atKidCls(x)?'checked':''} onchange="atWKid('${jx(x)}',this.checked)"> ${esc(x)}</label>`).join('')}</div>`};
AT.qr=()=>{const P=atPer(atG);return atHd('📷 QR কোড আগমন / প্রস্থান')+`<div class="card"><button class="btn" onclick="atKiosk()">🖥️ কিয়স্ক মোড চালু করুন (একের পর এক স্ক্যান)</button><p class="em" style="text-align:left">কিয়স্ক মোডে ক্যামেরা চালু থাকে; শিক্ষার্থী কার্ড দেখালেই হাজিরা হয় ও অভিভাবকের জন্য বার্তা তৈরি হয়।</p><label>মোড<select onchange="atMd=this.value"><option value="auto" ${atMd=='auto'?'selected':''}>স্বয়ংক্রিয় (প্রথম স্ক্যান আগমন, পরেরটি প্রস্থান)</option><option value="in" ${atMd=='in'?'selected':''}>শুধু আগমন</option><option value="out" ${atMd=='out'?'selected':''}>শুধু প্রস্থান</option></select></label><div class="f2"><button class="btn" onclick="atCam()">📷 ক্যামেরা চালু</button><button class="btn o" onclick="atCamOff()">বন্ধ করুন</button></div><video id="atv" playsinline muted style="width:100%;border-radius:10px;margin-top:10px;display:none"></video><form onsubmit="return atWCode(event)" style="margin-top:10px"><label>কোড লিখুন / স্ক্যানার দিয়ে স্ক্যান করুন<input name="c" autocomplete="off" placeholder="MA:t:…"></label></form><div id="atlog">${atTodayHtml()}</div><small style="color:var(--m)">আইফোনের ব্রাউজারে ক্যামেরা-স্ক্যান নাও চলতে পারে; তখন QR স্ক্যানার ডিভাইস বা কোড লিখে ব্যবহার করুন।</small></div><div class="card"><b>QR কার্ড</b><div class="f2">${atGsel()}<span></span></div>${P.length?`<button class="btn s o" onclick="atPrint('#atqr','p')">⬇ PDF ডাউনলোড</button>`:''}</div><div class="card" id="atqr"><div class="qrg">${P.map(p=>`<div class="qrc">${atQRsvg('MA:'+p.k)}<b>${esc(p.n)}</b><small>${esc(p.s)}</small><small style="font-family:monospace;user-select:all">MA:${p.k}</small></div>`).join('')||'<p class="em">কেউ নেই</p>'}</div></div>`};
AT.rep=()=>{const days=atDays(),work=days.filter(atWork),P=atPer(atG),sy={'উপস্থিত':'✓','দেরি':'⏰','অনুপস্থিত':'✗','ছুটি':'ছ'};return atHd('📊 মাসিক / সাপ্তাহিক রিপোর্ট')+atTabs()+`<div class="card"><div class="f2">${atPSel()}${atGsel()}</div><small style="color:var(--m)">কর্মদিবস (যেদিন হাজিরা নেওয়া হয়েছে): ${bn(work.length)} দিন</small></div><div class="card" style="overflow-x:auto"><table class="tb2"><tr><th>নাম</th>${atRP=='w'?days.map(d=>`<th>${ATDN[new Date(d+'T00:00:00').getDay()].slice(0,3)}</th>`).join(''):''}<th>উ</th><th>দে</th><th>অ</th><th>ছু</th><th>%</th></tr>${P.map(p=>{const c=atCnt(p.k,work);return `<tr><td>${esc(p.n)}</td>${atRP=='w'?days.map(d=>`<td>${atWork(d)?sy[atStat(d,p.k)]||'✗':'·'}</td>`).join(''):''}<td>${bn(c.u)}</td><td>${bn(c.l)}</td><td>${bn(c.a)}</td><td>${bn(c.v)}</td><td>${atPct(c,work.length)}</td></tr>`}).join('')||'<tr><td>কেউ নেই</td></tr>'}</table><small style="color:var(--m)">উ = উপস্থিত (দেরিসহ) · দে = দেরি · অ = অনুপস্থিত · ছু = ছুটি</small></div>`};
AT.sv=()=>{const cls=CL();if(!atC||!cls.includes(atC))atC=cls[0];const P=atPer('c:'+atC),days=atMDays(atM),work=days.filter(atWork),sel=P.find(p=>p.k==atSid);return atHd('🎓 শিক্ষার্থী হাজিরা ভিউ')+`<div class="card"><div class="f2"><label>শ্রেণি<select onchange="atC=this.value;atSid='';render()">${cls.map(c=>`<option ${c==atC?'selected':''}>${esc(c)}</option>`).join('')}</select></label><label>মাস<input type="month" value="${atM}" onchange="atM=this.value||atM;render()"></label></div></div><div class="card">${P.map(p=>{const c=atCnt(p.k,work);return `<div class="row tp" onclick="atSid='${jx(p.k)}';render()"><div><b>${esc(p.n)}</b><small>${esc(p.s)}</small></div><div class="r" style="text-align:right;font-size:13px"><span class="g">উপস্থিত ${bn(c.u)}</span> · <span class="rd">অনুপস্থিত ${bn(c.a)}</span><br>দেরি ${bn(c.l)} · ছুটি ${bn(c.v)} · ${atPct(c,work.length)}</div></div>`}).join('')||'<p class="em">এই শ্রেণিতে শিক্ষার্থী নেই</p>'}</div>`+(sel?`<div class="card"><b>${esc(sel.n)} — ${mn(atM)}</b>${days.filter(atWork).map(d=>{const r=atRec(d,sel.k);return `<div class="row"><span>${dt(d)} · ${ATDN[new Date(d+'T00:00:00').getDay()]}</span><span>${r.i?t12(r.i):''}${r.o?' – '+t12(r.o):''}${r.i2?' · '+t12(r.i2):''}${r.o2?' – '+t12(r.o2):''} ${atCh(atStat(d,sel.k)||'অনুপস্থিত')}</span></div>`}).join('')||'<p class="em">এই মাসে হাজিরার তথ্য নেই</p>'}</div>`:'')};
AT.edit=()=>{const P=atPer(atG),O=(v,l)=>`<option value="${v}">${l}</option>`;return atHd('✏️ হাজিরা এডিট / সংশোধন')+`<div class="card"><div class="f2">${atDsel()}${atGsel()}</div><small style="color:var(--m)">স্ট্যাটাস "স্বয়ংক্রিয়" রাখলে সময় দেখে উপস্থিত/দেরি ধরা হয়।</small></div><div class="card">${P.map(p=>{const r=atRec(atD,p.k);return `<div class="row" style="flex-wrap:wrap"><div style="flex:1;min-width:130px"><b>${esc(p.n)}</b><small>${esc(p.s)}${r.e?' · ✎ সংশোধিত '+dt(r.e):''}</small></div><select style="width:auto" onchange="atWField('${jx(p.k)}','st',this.value)">${[['','স্বয়ংক্রিয়'],['উপস্থিত','উপস্থিত'],['দেরি','দেরি'],['অনুপস্থিত','অনুপস্থিত'],['ছুটি','ছুটি']].map(o=>`<option value="${o[0]}" ${(r.st||'')==o[0]?'selected':''}>${o[1]}</option>`).join('')}</select><div class="tio"><label>আগমন<input type="time" value="${r.i||''}" onchange="atWField('${jx(p.k)}','i',this.value)"></label><label>প্রস্থান<input type="time" value="${r.o||''}" onchange="atWField('${jx(p.k)}','o',this.value)"></label>${atFT(p.k)?`<label>আগমন ২<input type="time" value="${r.i2||''}" onchange="atWField('${jx(p.k)}','i2',this.value)"></label><label>প্রস্থান ২<input type="time" value="${r.o2||''}" onchange="atWField('${jx(p.k)}','o2',this.value)"></label>`:''}</div></div>`}).join('')||'<p class="em">কেউ নেই</p>'}</div>`};
